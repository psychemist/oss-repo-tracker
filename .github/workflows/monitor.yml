name: Monitor OSS Repositories

on:
  schedule:
    - cron: "11 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oss-repo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ vars.MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      REPOS: |
        bitcoin/bitcoin
        bitcoin-core/secp256k1
      INITIAL_SINCE: "2026-11-10T23:00:00Z" # First catch-up: 11 Nov 2026, 00:00 Lagos.
      GH_TOKEN: ${{ github.token }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check new issues and pull requests
        run: node .github/scripts/monitor.mjs
